<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding Easy - Verified Startup Matchmaking</title>
    <meta name="description" content="Funding Easy is a private, trust-first, KYC-verified fundraising matchmaking platform connecting entrepreneurs and investors.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=2">
    <script>
        window.addEventListener('error', function(e) {
            document.body.innerHTML += '<div style="color:red;font-size:20px;padding:20px;background:white;z-index:9999;position:absolute;top:0;left:0;">ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            document.body.innerHTML += '<div style="color:red;font-size:20px;padding:20px;background:white;z-index:9999;position:absolute;top:0;left:0;">PROMISE ERROR: ' + e.reason + '</div>';
        });
    </script>
</head>
<body>
    <!-- Skip to content for accessibility -->
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="app"></div>
    <script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
