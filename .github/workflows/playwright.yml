name: FundingEasy Automated QA

on:
  push:
    branches: [main, 'qa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  playwright:
    name: Playwright QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npx -y @playwright/test@${{ env.PLAYWRIGHT_VERSION }} --version

      - name: Install Playwright browser
        run: npx -y @playwright/test@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium

      - name: Start local website
        run: |
          python3 -m http.server 4173 > /tmp/fundingeasy-server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null

      - name: Run automated QA
        run: npx -y @playwright/test@${{ env.PLAYWRIGHT_VERSION }} test
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
